version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      actions-versions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      time: "06:15"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    groups:
      gradle-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      gradle-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: deno
    directory: /supabase/functions/garmin-sync
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      edge-versions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      edge-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: deno
    directory: /supabase/functions/social-live-gateway
    schedule:
      interval: monthly
      time: "06:45"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      edge-versions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      edge-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: deno
    directory: /supabase/functions/push-dispatch
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      edge-versions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      edge-security:
        applies-to: security-updates
        patterns: ["*"]
