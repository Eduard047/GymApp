project_id = "gymapp"

# The bounded user-state projection migrations use PostgreSQL 17 JSONPath
# features. Pin local resets to the same major version as production so a fresh
# checkout fails neither silently nor halfway through the migration chain.
[db]
major_version = 17

# Local Auth email preview/source of truth. Hosted Supabase projects keep their
# own Auth template settings; review and copy this template in the Dashboard
# only as an explicit release action.
[auth.email.template.confirmation]
subject = "Confirm your GymApp email"
content_path = "./supabase/templates/confirmation.html"

# Garmin fetch/ack uses a high-entropy device capability instead of a Supabase
# user JWT. createDevice/revokeDevice still authenticate explicitly in code.
[functions.garmin-sync]
verify_jwt = false

# Account deletion accepts only an authenticated Supabase user bearer. The
# function performs its additional live-session check before the admin delete.
[functions.delete-account]
verify_jwt = true

# Social/live calls authenticate a user JWT again with Auth getUser, then pass
# only an allowlisted, bounded action through the durable gateway perimeter.
[functions.social-live-gateway]
verify_jwt = true

# Dispatch is server-to-server only. pg_net sends a dedicated high-entropy
# PUSH_DISPATCH_SERVER_KEY in apikey plus an independent dispatcher token.
# JWT gateway verification stays disabled; the Supabase secret/service-role key
# is reserved for internal RPCs and is never copied into Vault or cron headers.
[functions.push-dispatch]
verify_jwt = false
