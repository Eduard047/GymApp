<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eaf1f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#04070c" media="(prefers-color-scheme: dark)">
    <title>Email confirmed - GymApp</title>
    <link rel="stylesheet" href="./confirmed.css?v=2">
  </head>
  <body>
    <main class="confirmation-page">
      <section class="confirmation-panel" aria-labelledby="confirmation-title">
        <span class="confirmation-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <p class="eyebrow">GymApp</p>
        <h1 id="confirmation-title">Email confirmed</h1>
        <p class="message">Your account is ready. You can return to GymApp and log in.</p>
        <a id="open-app" class="button" href="com.setforge.gymapp://auth/callback">Open GymApp</a>
      </section>
    </main>
    <script src="./confirmed.js?v=1" defer></script>
